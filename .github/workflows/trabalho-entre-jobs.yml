name: Vendo arquivos compartilhados entre steps

on:
  push:
    branches:
      - main

jobs: 
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Confere versao do ubuntu
        run: cat /etc/os-release

      - name: Exibir uma mensagem
        run: echo "Estou fazendo o curso do Github Actions de Linuxtips" > ${{github.workspace}}/mensagem.txt

      - uses: actions/upload-artifact@v4 with
        name: strigus-upload
        path: ${{github.workspace}}/mensagem.txt

job_2:
  runs-on: ubuntu-
  needs: job_1
  steps:
    - name: Ver o conteudo do diretorio
      run: ls -lha

      uses: actions/download-artifact@v4
      with:
        name: strigus-upload
        path: strigus

    - name: Ver o conteudo do diretorio
      run: ls -lha && ls ./strigus/

    - name: Acessar arquivo mensagem
      run: mv strigus/mensagem.txt . && rm -rf ./strigus

    - name: Ver o conteudo do diretorio
      run: ls -lha

    - name: Exibir arquivo mensagem
      run: cat mensagem.txt